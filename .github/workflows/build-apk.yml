name: Build DarkMora Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: |
          npm install

      - name: ⚙️ Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🚀 Prebuild Native Android Project
        run: |
          npx expo prebuild --platform android --clean

      - name: 🔨 Build Android APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📂 Locate APK
        run: |
          mkdir -p build_output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build_output/DarkMora.apk \;
          echo "APK tayyor:"
          ls -la build_output/

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkMora-Android-APK
          path: build_output/DarkMora.apk
          retention-days: 14

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          files: build_output/DarkMora.apk
          name: DarkMora v1.0.0
          tag_name: v1.0.0-build-${{ github.run_number }}
          body: |
            ## DarkMora Rasmiy Mobil Ilovasi (100% Native Android APK)
            - WebView ishlatilmagan (haqiqiy Android Native ilova)
            - Native ExoPlayer (video streaming)
            - Darkmora.uz sayti bilan 1x1 to'liq bir xil
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
