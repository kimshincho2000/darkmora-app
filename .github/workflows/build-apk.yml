name: Build DarkMora Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Optimized Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: |
          npm install

      - name: 🚀 Prebuild Native Android Project
        run: |
          npx expo prebuild --platform android --clean

      - name: ⚙️ Configure Release Signing
        run: |
          # Telefonga bemalol o'rnatilishi uchun release buildga ham universal kalit ulaymiz
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle

      - name: 🔨 Build Optimized Release APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📂 Locate Release APK
        run: |
          mkdir -p build_output
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} build_output/DarkMora.apk \;
          echo "Optimallashtirilgan Release APK hajmi:"
          ls -lh build_output/DarkMora.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkMora-Android-APK
          path: build_output/DarkMora.apk
          retention-days: 14
